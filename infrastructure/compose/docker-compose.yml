services:
  mongodb:
    image: mongo:7
    container_name: cloud-ide-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - cloudide-app-net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  sandbox-python:
    build:
      context: ../docker/python
    image: cloudide-sandbox-python:3.12
    profiles: ['images']

  sandbox-node:
    build:
      context: ../docker/node
    image: cloudide-sandbox-node:20
    profiles: ['images']

  sandbox-java:
    build:
      context: ../docker/java
    image: cloudide-sandbox-java:21
    profiles: ['images']

  sandbox-cpp:
    build:
      context: ../docker/cpp
    image: cloudide-sandbox-cpp:13
    profiles: ['images']

  backend:
    build:
      context: ../../backend
    container_name: cloud-ide-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      NODE_ENV: production
      DEV_ACCESS_MODE: 'false'
      MONGODB_URI: mongodb://mongodb:27017/distributed_cloud_ide
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_32_characters_min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_32_characters_min}
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      FRONTEND_URL: http://localhost:3000
      CONTAINER_MEMORY_LIMIT_MB: 256
      CONTAINER_CPU_LIMIT: '0.5'
      CONTAINER_PIDS_LIMIT: 64
      CONTAINER_MAX_ACTIVE: 10
      CONTAINER_IDLE_TIMEOUT_MS: 3600000
      CONTAINER_NETWORK_MODE: none
    networks:
      - cloudide-app-net
    depends_on:
      mongodb:
        condition: service_healthy

networks:
  cloudide-app-net:
    driver: bridge
  cloudide-sandbox-net:
    driver: bridge
    internal: true

volumes:
  mongodb_data:
